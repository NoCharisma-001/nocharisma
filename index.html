<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>No Charisma – Coming Soon</title>
  <meta name="description" content="No Charisma. All Substance. A minimalist brand for digital creators and anti-brand thinkers.">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-bg: #0f0f0f;
      --accent: #ff3366;
      --text-light: #f5f5f5;
      --max-width: 800px;
    }
    * {box-sizing: border-box; margin: 0; padding: 0;}
    body {
      font-family: 'Poppins', sans-serif;
      background: var(--primary-bg);
      color: var(--text-light);
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      width: 100%;
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: 0.05em;
    }
    .nav a {
      color: var(--text-light);
      text-decoration: none;
      margin-left: 1.5rem;
      transition: opacity 0.2s;
    }
    .nav a:hover {opacity: 0.7;}
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1.5rem;
    }
    .hero {
      max-width: var(--max-width);
    }
    .hero h1 {
      font-size: clamp(2.5rem, 6vw, 4rem);
      margin-bottom: 1rem;
      letter-spacing: 0.05em;
    }
    .tagline {
      font-size: clamp(1rem, 2.5vw, 1.5rem);
      margin-bottom: 2rem;
      opacity: 0.85;
    }
    .cta {
      display: inline-block;
      padding: 0.85rem 1.75rem;
      background: var(--accent);
      color: #fff;
      border-radius: 40px;
      text-decoration: none;
      font-weight: 600;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(255, 51, 102, 0.4);
    }
    form {
      margin-top: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      align-items: center;
    }
    input[type="email"] {
      padding: 0.75rem;
      width: 100%;
      max-width: 300px;
      border-radius: 4px;
      border: none;
      font-size: 1rem;
    }
    button {
      padding: 0.75rem 1.5rem;
      background-color: var(--accent);
      color: #fff;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }
    footer {
      text-align: center;
      padding: 1rem;
      font-size: 0.875rem;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">No Charisma</div>
    <nav class="nav">
      <a href="mailto:hello@nocharisma.com">Email</a>
      <a href="https://instagram.com/nocharisma" target="_blank">Instagram</a>
    </nav>
  </header>
  <main>
    <section class="hero">
      <h1>No Charisma</h1>
      <p class="tagline">Minimal charm. Maximum impact.</p>
      <form action="https://formspree.io/f/your_form_id" method="POST">
        <input type="email" name="email" placeholder="Enter your email" required>
        <button type="submit">Get Updates</button>
      </form>
    </section>
  </main>
  <footer>
    © <span id="year"></span> No Charisma. All rights reserved.
  </footer>
  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
